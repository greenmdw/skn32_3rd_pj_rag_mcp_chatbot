  <text x="200" y="496" text-anchor="middle" font-size="10.5" fill="#64748b">document_evidence 에만 기록</text>

  <rect x="385" y="455" width="310" height="55" rx="9" fill="#ffffff" stroke="#3b82f6"/>
  <text x="540" y="478" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Data Retrieval</text>
  <text x="540" y="496" text-anchor="middle" font-size="10.5" fill="#64748b">database_evidence 에만 기록</text>

  <rect x="45" y="559" width="310" height="55" rx="9" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="200" y="582" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Document MCP</text>
  <text x="200" y="600" text-anchor="middle" font-size="10.5" fill="#64748b">문서 경로 조회 → 파일 로드 → 검색</text>

  <rect x="385" y="559" width="310" height="55" rx="9" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="540" y="582" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6d28d9">Data MCP</text>
  <text x="540" y="600" text-anchor="middle" font-size="10.5" fill="#64748b">query_sales · query_purchase</text>

  <rect x="45" y="663" width="310" height="65" rx="9" fill="#ffffff" stroke="#22c55e"/>
  <text x="200" y="686" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">FAISS 인덱스 · 원문 PDF</text>
  <text x="200" y="704" text-anchor="middle" font-size="10.5" fill="#64748b">768차원 · 381 청크</text>
  <text x="200" y="719" text-anchor="middle" font-size="10.5" fill="#64748b">벡터 + 어휘(IDF) 하이브리드 검색</text>

  <rect x="385" y="663" width="310" height="65" rx="9" fill="#ffffff" stroke="#22c55e"/>
  <text x="540" y="686" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Text2SQL → MySQL</text>
  <text x="540" y="704" text-anchor="middle" font-size="10.5" fill="#64748b">4겹 안전장치 · 조회 전용 계정</text>
  <text x="540" y="719" text-anchor="middle" font-size="10.5" fill="#64748b">sales · purchase (조회 뷰 5개씩)</text>

  <rect x="150" y="756" width="440" height="55" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="370" y="779" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Evidence Eval</text>
  <text x="370" y="798" text-anchor="middle" font-size="11" fill="#64748b">관련성 · 충분성 · 충돌 검사 → 근거 부족 시 1회 보강 조회</text>

  <rect x="150" y="831" width="440" height="55" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="370" y="854" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Answer Synthesis</text>
  <text x="370" y="873" text-anchor="middle" font-size="11" fill="#64748b">채택된 근거만 LLM에 전달 (환각 차단)</text>

  <rect x="730" y="831" width="250" height="55" rx="9" fill="#172033" stroke="#172033"/>
  <text x="855" y="854" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">답변 · 출처 · 표 · 차트</text>
  <text x="855" y="872" text-anchor="middle" font-size="10.5" fill="#cbd5e1">생성 SQL · 근거 상태 포함</text>

